# TrailSource OPC UA adapter configuration (example for the demo stack).
# Dollar-brace placeholders (NAME inside the braces) are expanded from the
# environment at start-up. Secret keys (password, username, token, ...) are
# masked before config_version is computed, so rotating a secret does not
# change the hash.
revision: "1"

producer:
  id: trailsource-opcua-extruder-01

site: plant-a
line: ext-01
device: extruder-01

source:
  id: plant-a-ext-01-extruder-01-opcua
  endpoint: opc.tcp://opcua-sim:4840/trailsource
  security_policy: None          # lab only; use Basic256Sha256 + SignAndEncrypt against real servers
  security_mode: None
  # With Sign or SignAndEncrypt: trust list and own certificate in OPC UA
  # layout (trailsource gen-cert --pki creates it; docs/CONNECT_YOUR_SERVER.md).
  # Only server certificates in pki/trusted/certs (or chained to a trusted CA
  # with a current CRL) are used; refused ones land in pki/rejected/.
  # pki_dir: /etc/trailsource/pki
  # server_thumbprint: ""        # optional pin (SHA-1) in addition to the trust list
  auth: anonymous                # anonymous | username
  username: "${TRAILSOURCE_OPCUA_USERNAME}"
  password: "${TRAILSOURCE_OPCUA_PASSWORD}"
  # password_file: /etc/trailsource/opcua.password   # instead of password; mode 0600 or stricter
  browse_roots:
    - "nsu=urn:trailsource:sim:opcua;s=Plant"   # below the plant object; URI form survives a renumbered namespace
  max_depth: 16
  max_nodes: 2500
  subscription_interval_ms: 500
  # sampling_interval_ms: 500    # default: subscription_interval_ms; 0 = the server's fastest rate
  subscription_batch_size: 50
  rebrowse_interval_s: 30        # one subscription per session; a re-browse only adds/removes changed items
  session_backoff_s: 5
  request_timeout_s: 12
  # browse_timeout_s: 120        # for the whole browse
  # liveness_interval_s: 10      # read ServerStatus.CurrentTime; detects half-open connections
  # keepalive_interval_s: 10     # subscription keep-alive; no publish response within it (x1.5) is a stall

mqtt:
  broker: tcp://mosquitto:1883   # TrailMQ: ssl://trailmq:8883 with tls.enabled: true
  client_id: trailsource-opcua-extruder-01
  username: "${TRAILSOURCE_MQTT_USERNAME}"
  password: "${TRAILSOURCE_MQTT_PASSWORD}"
  qos: 1
  topic_prefix: trailsource/plant-a/ext-01/extruder-01
  publish_node_topics: false
  health_interval_s: 15
  tls:
    enabled: false
    ca_cert: ""
    client_cert: ""
    client_key: ""
    insecure_skip_verify: false
    server_name: ""

mapping_file: /config/mapping/extruder.yaml
state_dir: /state

journal:
  enabled: true
  path: /journal/plant-a-ext-01-extruder-01-opcua.jsonl

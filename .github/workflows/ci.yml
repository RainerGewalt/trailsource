name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Conformance (docs/TESTING.md, L3): the reference vectors and the
      # reason-code catalog of trail-evidence. Pinned to v0.2.0 plus the
      # catalog entry source.subscription_stalled (commit 305b587 on main),
      # which TrailSource 0.1 emits and the v0.2.0 tag does not contain yet;
      # switch to the next trail-evidence tag once it is published. The
      # vectors are those of v0.2.0. The go tool ignores directories that
      # start with a dot.
      - uses: actions/checkout@v4
        with:
          repository: RainerGewalt/trail-evidence
          ref: 305b5879a74348a4be61ba81d511958e1dcdfbaf
          path: .trail-evidence
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
        env:
          TRAIL_EVIDENCE_DIR: ${{ github.workspace }}/.trail-evidence

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile
        run: |
          python -m py_compile adapters/modbus/main.py adapters/ethernetip/main.py \
            adapters/pylib/trailsource_adapter/runtime.py \
            sim/opcua/main.py sim/modbus/main.py sim/ethernetip/main.py \
            scripts/tamper.py scripts/tcp_relay.py scripts/check_bindings.py scripts/check_demo_init.py
      - name: unit tests (stdlib only)
        run: cd adapters/pylib && python -m unittest discover -s tests -t . -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config >/dev/null
      - name: demo-init chmod stays limited to the demo directories
        run: docker compose config --format json | python3 scripts/check_demo_init.py "$PWD"

name: release

# On a tag v*: Go tests with the conformance checks (L3, never skipped) and
# govulncheck, then the trailsource binaries with GoReleaser
# (attached to the GitHub release with checksums.txt) and the container
# image ghcr.io/<owner>/trailsource:<version> and :latest for linux/amd64
# and linux/arm64 from ./Dockerfile (the Go adapter only).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Conformance (docs/TESTING.md, L3) as in ci.yml: the reference vectors
      # and the reason-code catalog of trail-evidence v0.2.1. With CI=true
      # (always set on GitHub Actions) the tests fail instead of skipping
      # when the checkout is missing.
      - uses: actions/checkout@v4
        with:
          repository: RainerGewalt/trail-evidence
          ref: v0.2.1
          path: .trail-evidence
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: toolchain pins agree
        run: scripts/check_toolchain.sh
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - name: test
        run: go test ./...
        env:
          TRAIL_EVIDENCE_DIR: ${{ github.workspace }}/.trail-evidence
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  goreleaser:
    name: GoReleaser
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container image
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag without its leading v (v0.1.0 -> 0.1.0), as GoReleaser names
      # the archives: records carry the same producer version either way.
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trailsource
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=trailsource
            org.opencontainers.image.description=Read-only OPC UA source adapter that seals every observation as a Trail Evidence Record
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# TrailSource demo stack: three simulated sources, three adapters, one broker.
#
#   make demo      build and start everything
#   make verify    verify the journals the adapters wrote to ./.demo/journal
#
# The broker is Mosquitto so the stack depends on no particular broker. To
# use another one, point mqtt.broker in configs/*.yaml at it, for example
# ssl://<host>:8883 with mqtt.tls.enabled: true and credentials via
# TRAILSOURCE_MQTT_USERNAME / TRAILSOURCE_MQTT_PASSWORD. With TrailMQ, give
# the adapters' role publish rights on their topics first (README, "Using it
# with TrailMQ").

x-common: &common
  restart: unless-stopped
  networks: [trailsource]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-adapter-env: &adapter-env
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  TRAILSOURCE_MQTT_USERNAME: "${TRAILSOURCE_MQTT_USERNAME:-}"
  TRAILSOURCE_MQTT_PASSWORD: "${TRAILSOURCE_MQTT_PASSWORD:-}"
  TRAILSOURCE_OPCUA_USERNAME: "${TRAILSOURCE_OPCUA_USERNAME:-}"
  TRAILSOURCE_OPCUA_PASSWORD: "${TRAILSOURCE_OPCUA_PASSWORD:-}"

services:
  # Demo only. The adapters run as uid 10001, but ./.demo/state and
  # ./.demo/journal belong to whoever created them: your user (make demo) or
  # root (Docker, when they are missing). This one-shot step makes both
  # directories writable for everyone, whatever the host uid; the adapters
  # then write files with mode 0644 that you can read, verify and delete from
  # the host. Existing state and journals are kept. A real deployment mounts
  # directories owned by the adapter's user instead (README, "Install").
  demo-init:
    image: alpine:3.21
    container_name: trailsource_demo_init
    user: "0:0"
    network_mode: none
    restart: "no"
    command: ["chmod", "0777", "/demo/state", "/demo/journal"]
    volumes:
      - ./.demo/state:/demo/state
      - ./.demo/journal:/demo/journal

  mosquitto:
    <<: *common
    image: eclipse-mosquitto:2.0
    container_name: trailsource_mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  opcua-sim:
    <<: *common
    build: ./sim/opcua
    container_name: trailsource_opcua_sim
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SIM_INTERVAL_SECONDS: "1.0"
      SIM_ADD_NODE_AFTER_S: "${SIM_ADD_NODE_AFTER_S:-120}"
    ports:
      - "${OPCUA_PORT:-4840}:4840"

  modbus-sim:
    <<: *common
    build: ./sim/modbus
    container_name: trailsource_modbus_sim
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "${MODBUS_PORT:-5020}:5020"

  ethernetip-sim:
    <<: *common
    build: ./sim/ethernetip
    container_name: trailsource_ethernetip_sim
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "${ENIP_SHIM_PORT:-8080}:8080"

  opcua-adapter:
    <<: *common
    build:
      context: .
      args: { VERSION: "${TRAILSOURCE_VERSION:-0.1.0-dev}" }
    container_name: trailsource_opcua_adapter
    depends_on:
      demo-init: { condition: service_completed_successfully }
      mosquitto: { condition: service_healthy }
      opcua-sim: { condition: service_started }
    environment: *adapter-env
    command: ["run", "--config", "/config/opcua-extruder.yaml"]
    volumes:
      - ./configs:/config:ro
      - ./.demo/state:/state
      - ./.demo/journal:/journal

  modbus-adapter:
    <<: *common
    build: ./adapters
    container_name: trailsource_modbus_adapter
    depends_on:
      demo-init: { condition: service_completed_successfully }
      mosquitto: { condition: service_healthy }
      modbus-sim: { condition: service_started }
    environment:
      <<: *adapter-env
      ADAPTER: modbus
      TRAILSOURCE_CONFIG: /config/modbus-energy-meter.yaml
      TRAILSOURCE_VERSION: "${TRAILSOURCE_VERSION:-0.1.0-dev}"
    volumes:
      - ./configs:/config:ro
      - ./.demo/state:/state
      - ./.demo/journal:/journal

  ethernetip-adapter:
    <<: *common
    build: ./adapters
    container_name: trailsource_ethernetip_adapter
    depends_on:
      demo-init: { condition: service_completed_successfully }
      mosquitto: { condition: service_healthy }
      ethernetip-sim: { condition: service_started }
    environment:
      <<: *adapter-env
      ADAPTER: ethernetip
      TRAILSOURCE_CONFIG: /config/ethernetip-robot-cell.yaml
      TRAILSOURCE_VERSION: "${TRAILSOURCE_VERSION:-0.1.0-dev}"
    volumes:
      - ./configs:/config:ro
      - ./.demo/state:/state
      - ./.demo/journal:/journal

networks:
  trailsource:
    name: trailsource_net
